<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Billing Tool | EG Website Solutions</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ink:#12263f;--teal:#0b7a75;--tealbg:#e8f4f3;--line:#e1e6ee;--mut:#5d6878;--soft:#f6f8fb;--ok:#14804a;--due:#b4540a;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:#fff}
header{border-bottom:1px solid var(--line);padding:18px 16px}
header div{max-width:1080px;margin:auto}
h1{margin:0;font-size:22px;letter-spacing:-.2px}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.wrap{max-width:1080px;margin:auto;padding:24px 16px 48px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
h2{font-size:17px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.bal{display:flex;justify-content:space-between;align-items:center;margin:18px 0;padding:14px 16px;background:var(--tealbg);border-radius:10px}
.bal span{font-weight:600}.bal strong{font-size:24px;color:var(--teal)}
details{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px}
summary{cursor:pointer;font-weight:600}
details .grid{margin-top:14px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px}
button:hover{background:var(--soft)}
.primary{width:100%;background:var(--ink);color:#fff;border-color:var(--ink);padding:13px;font-weight:600;font-size:16px}
.primary:hover{background:#1c3a5e}
.link{border:0;background:none;color:var(--teal);padding:0 4px;text-decoration:underline}
#editBar{background:#fff7e6;border:1px solid #f0d9a8;border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stats div{background:var(--soft);border-radius:10px;padding:10px 12px}
.stats span{display:block;font-size:12px;color:var(--mut)}
.stats b{font-size:16px}
ul{list-style:none;margin:0;padding:0}
.row{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:10px}
.top b{overflow-wrap:anywhere}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.chip{font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;height:fit-content}
.chip.paid{background:#e4f5ec;color:var(--ok)}.chip.due{background:#fdeedd;color:var(--due)}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button{font-size:13px;padding:4px 10px}
.danger{color:var(--red)}
.empty{color:var(--mut);background:var(--soft);border-radius:10px;padding:16px}
</style>
</head>
<body>
<header><div><h1>Client Billing Tool</h1><p>EG WEBSITE SOLUTIONS, Sonipat</p></div></header>
<main class="wrap">
<section>
  <h2>New invoice</h2>
  <div id="editBar" hidden>Editing invoice <b id="editNo"></b> <button class="link" id="cancelEdit" type="button">Cancel</button></div>
  <div class="grid">
    <div><label for="client">Client name</label><input id="client" placeholder="Dr. Sapna Sharma"></div>
    <div><label for="clinic">Clinic name</label><input id="clinic" placeholder="Dr. Sapna’s Advanced Microscopic Dental Care"></div>
    <div><label for="location">Location</label><input id="location" placeholder="Rohtak, Haryana"></div>
    <div><label for="date">Date</label><input type="date" id="date"></div>
    <div class="full"><label for="service">Service</label><input id="service"></div>
    <div><label for="total">Total amount (₹)</label><input type="number" id="total" inputmode="numeric" min="0"></div>
    <div><label for="advance">Advance amount (₹)</label><input type="number" id="advance" inputmode="numeric" min="0"></div>
  </div>
  <div class="bal"><span>Balance due</span><strong id="bal">₹0</strong></div>
  <details id="biz">
    <summary>Business details and invoice content</summary>
    <div class="grid">
      <div><label for="bizName">Business name</label><input id="bizName"></div>
      <div><label for="city">City</label><input id="city"></div>
      <div><label for="phone">Your phone number</label><input id="phone" inputmode="tel" placeholder="+91 98XXXXXXXX"></div>
      <div><label for="payment">UPI / bank details (optional)</label><input id="payment" placeholder="UPI: yourname@upi"></div>
      <div class="full"><label for="features">What’s included (one point per line)</label><textarea id="features" rows="8"></textarea></div>
      <div class="full"><label for="notes">Payment terms</label><textarea id="notes" rows="2"></textarea></div>
    </div>
  </details>
  <button class="primary" id="gen" type="button">Generate PDF</button>
</section>
<aside>
  <h2>Invoice history</h2>
  <div class="stats" id="stats"></div>
  <ul id="list"></ul>
</aside>
</main>
<script>
const $=id=>document.getElementById(id);
const KEY="egbill_history",SKEY="egbill_settings",CKEY="egbill_counter";
const DEF_FEATURES=["Custom-designed responsive website (mobile, tablet and desktop)","Premium look with smooth animations and a fast-loading theme","On-page SEO setup: meta tags, clean headings, Google-friendly structure","Treatment and service pages with an FAQ section","Appointment request form with WhatsApp and call buttons","Patient reviews and feedback section","Google Maps location with directions","AI chatbot assistant for instant patient queries","Social media integration (YouTube, Instagram)"].join("\n");
const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let history=rd(KEY,[]);
let settings=Object.assign({bizName:"EG WEBSITE SOLUTIONS",city:"Sonipat, Haryana",phone:"",payment:"",features:DEF_FEATURES,notes:"Balance payable on delivery of the final website. Thank you for your business!"},rd(SKEY,{}));
let editId=null;
const SET=["bizName","city","phone","payment","features","notes"];
const money=(n,p="₹")=>p+Number(n||0).toLocaleString("en-IN");
const fmtDate=s=>new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

function calc(){const b=(+$("total").value||0)-(+$("advance").value||0);$("bal").textContent=money(b)}
function resetForm(){
  editId=null;$("editBar").hidden=true;$("gen").textContent="Generate PDF";
  ["client","clinic","location"].forEach(i=>$(i).value="");
  $("service").value="Website + SEO + Chatbot";$("total").value=6000;$("advance").value=3000;$("date").value=today();
  SET.forEach(k=>$(k).value=settings[k]);calc();
}
function readForm(){
  const r={client:$("client").value.trim(),clinic:$("clinic").value.trim(),location:$("location").value.trim(),service:$("service").value.trim()||"Website Development",date:$("date").value||today(),total:+$("total").value||0,advance:+$("advance").value||0};
  SET.forEach(k=>r[k]=$(k).value.trim());
  if(!r.client){alert("Client name daalein.");$("client").focus();return null}
  if(r.total<=0){alert("Total amount daalein.");$("total").focus();return null}
  if(r.advance>r.total){alert("Advance total se zyada nahi ho sakta.");$("advance").focus();return null}
  if(!r.phone){$("biz").open=true;alert("Business details me apna phone number daalein.");$("phone").focus();return null}
  return r;
}
function makePDF(r){
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){alert("PDF library load nahi hui. Internet on karke page reload karein.");return}
  const d=new J({unit:"mm",format:"a4"}),W=210,M=18,navy=[18,38,63],teal=[11,122,117],grey=[93,104,120],bal=r.total-r.advance;
  d.setFillColor(...navy);d.rect(0,0,W,6,"F");
  d.setFont("helvetica","bold");d.setFontSize(20);d.setTextColor(...navy);d.text(r.bizName,M,23);
  d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(...grey);d.text(r.city,M,29);d.text("Phone: "+r.phone,M,34);
  d.setFont("helvetica","bold");d.setFontSize(26);d.setTextColor(...teal);d.text("INVOICE",W-M,23,{align:"right"});
  d.setFontSize(10);d.setTextColor(...navy);d.text("Invoice No: "+r.no,W-M,30,{align:"right"});
  d.setFont("helvetica","normal");d.text("Date: "+fmtDate(r.date),W-M,35,{align:"right"});
  d.setDrawColor(225,230,238);d.line(M,41,W-M,41);
  d.setFont("helvetica","bold");d.setFontSize(9);d.setTextColor(...grey);d.text("BILLED TO",M,49);
  d.setFontSize(13);d.setTextColor(...navy);d.text(r.client,M,56);
  d.setFont("helvetica","normal");d.setFontSize(10.5);let y=62;
  if(r.clinic){d.text(r.clinic,M,y);y+=5.5}
  if(r.location){d.text(r.location,M,y);y+=5.5}
  y=Math.max(y,68)+6;
  d.setFillColor(...navy);d.rect(M,y,W-2*M,9,"F");
  d.setTextColor(255,255,255);d.setFont("helvetica","bold");d.setFontSize(10);
  d.text("Description",M+4,y+6);d.text("Amount",W-M-4,y+6,{align:"right"});
  y+=17;d.setTextColor(...navy);d.setFontSize(12);
  const sv=d.splitTextToSize(r.service,115);d.text(sv,M+4,y);d.text(money(r.total,"Rs. "),W-M-4,y,{align:"right"});
  y+=sv.length*5.5;
  d.setFont("helvetica","normal");d.setFontSize(9.5);d.setTextColor(...grey);d.text("Includes:",M+4,y);y+=5.5;
  d.setTextColor(50,60,75);
  r.features.split("\n").map(s=>s.trim()).filter(Boolean).forEach(f=>{
    const ln=d.splitTextToSize(f,W-2*M-22);
    if(y>225){d.addPage();y=20}
    d.setFillColor(...teal);d.circle(M+6,y-1,0.9,"F");d.text(ln,M+10,y);y+=ln.length*4.8+1.4;
  });
  y+=3;d.setDrawColor(225,230,238);d.line(M,y,W-M,y);y+=9;
  if(y>215){d.addPage();y=22}
  const lx=122,rx=W-M-4,row=(a,b,bold)=>{d.setFont("helvetica",bold?"bold":"normal");d.setFontSize(10.5);d.setTextColor(...navy);d.text(a,lx,y);d.text(b,rx,y,{align:"right"});y+=7};
  const y0=y;
  row("Total Amount",money(r.total,"Rs. "));
  row("Advance Received","- "+money(r.advance,"Rs. "));
  d.setFillColor(232,244,243);d.rect(lx-4,y-5,W-M-lx+4,11,"F");
  d.setTextColor(...teal);d.setFont("helvetica","bold");d.setFontSize(12);d.text("Balance Due",lx,y+2);d.text(money(bal,"Rs. "),rx,y+2,{align:"right"});
  d.setDrawColor(...teal);d.setLineWidth(0.5);d.roundedRect(M,y0-4,48,10,2,2);
  d.setFontSize(10);d.text(bal>0?"ADVANCE RECEIVED":"PAID IN FULL",M+24,y0+2.5,{align:"center"});
  y+=18;d.setLineWidth(0.2);
  if(r.payment){d.setFont("helvetica","bold");d.setFontSize(9.5);d.setTextColor(...grey);d.text("Payment details",M,y);d.setFont("helvetica","normal");d.setTextColor(...navy);d.text(d.splitTextToSize(r.payment,100),M,y+5.5);y+=14}
  if(r.notes){d.setFont("helvetica","bold");d.setFontSize(9.5);d.setTextColor(...grey);d.text("Terms",M,y);d.setFont("helvetica","normal");d.setTextColor(...navy);d.text(d.splitTextToSize(r.notes,100),M,y+5.5)}
  const sy=Math.max(y+30,252);
  d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(...grey);d.text("For "+r.bizName,W-M,sy-16,{align:"right"});
  d.setDrawColor(...navy);d.line(W-M-62,sy,W-M,sy);d.setTextColor(...navy);d.text("Authorised Signature",W-M,sy+5.5,{align:"right"});
  d.setFontSize(8.5);d.setTextColor(...grey);d.text("This is a computer generated invoice.",W/2,288,{align:"center"});
  d.setFillColor(...navy);d.rect(0,291,W,6,"F");
  d.save("Invoice_"+r.no+"_"+(r.clinic||r.client).replace(/[^a-z0-9]+/gi,"_")+".pdf");
}
function generate(){
  const r=readForm();if(!r)return;
  wr(SKEY,Object.fromEntries(SET.map(k=>[k,r[k]])));settings=Object.fromEntries(SET.map(k=>[k,r[k]]));
  if(editId){const i=history.findIndex(h=>h.id===editId);r.id=editId;r.no=history[i].no;history[i]=r}
  else{const n=(rd(CKEY,0)||0)+1;wr(CKEY,n);r.id=String(Date.now());r.no="EGWS-"+r.date.slice(0,4)+"-"+String(n).padStart(3,"0");history.unshift(r)}
  wr(KEY,history);render();makePDF(r);resetForm();
}
function render(){
  const bill=history.reduce((a,h)=>a+h.total,0),rec=history.reduce((a,h)=>a+h.advance,0);
  $("stats").innerHTML=`<div><span>Total billed</span><b>${money(bill)}</b></div><div><span>Received</span><b>${money(rec)}</b></div><div><span>Pending</span><b>${money(bill-rec)}</b></div>`;
  $("list").innerHTML=history.length?history.map(h=>{const b=h.total-h.advance;
    return `<li class="row"><div class="top"><div><b>${esc(h.clinic||h.client)}</b><div class="meta"><span>${esc(h.no)}</span><span>${fmtDate(h.date)}</span>${h.clinic?`<span>${esc(h.client)}</span>`:""}</div></div><div style="text-align:right"><b>${money(h.total)}</b><br><span class="chip ${b>0?"due":"paid"}">${b>0?"Due "+money(b):"Paid"}</span></div></div><div class="acts"><button data-act="pdf" data-id="${h.id}">Download PDF</button><button data-act="edit" data-id="${h.id}">Edit</button><button class="danger" data-act="del" data-id="${h.id}">Delete</button></div></li>`}).join(""):`<li class="empty">No invoices yet. Fill the form and generate your first one; it will be saved here.</li>`;
}
$("list").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const h=history.find(x=>x.id===b.dataset.id);if(!h)return;
  if(b.dataset.act==="pdf")makePDF(h);
  if(b.dataset.act==="del"&&confirm("Delete invoice "+h.no+"?")){history=history.filter(x=>x.id!==h.id);wr(KEY,history);render();if(editId===h.id)resetForm()}
  if(b.dataset.act==="edit"){
    ["client","clinic","location","service","total","advance","date"].forEach(k=>$(k).value=h[k]);
    SET.forEach(k=>$(k).value=h[k]);editId=h.id;$("editNo").textContent=h.no;$("editBar").hidden=false;$("gen").textContent="Update and download PDF";calc();window.scrollTo({top:0,behavior:"smooth"});
  }
});
["total","advance"].forEach(i=>$(i).addEventListener("input",calc));
SET.forEach(k=>$(k).addEventListener("input",()=>{settings[k]=$(k).value;wr(SKEY,settings)}));
$("cancelEdit").onclick=resetForm;$("gen").onclick=generate;
resetForm();$("biz").open=!settings.phone;render();
</script>
</body>
</html>
